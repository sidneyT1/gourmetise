nelmio_cors:
  defaults:
    allow_origin: ['http://localhost:5173']   # Remplace par l'URL de ton frontend
    allow_methods: ['GET', 'POST', 'PUT', 'DELETE']
    allow_headers: ['Content-Type', 'Authorization']
    max_age: 3600
  paths:
    '^/api/': ~  # Permet l'accès CORS pour toutes les routes API
